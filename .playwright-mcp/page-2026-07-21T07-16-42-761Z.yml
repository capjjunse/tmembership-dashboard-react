              - generic [ref=f1e134]: 2025-02-14
            - generic [ref=f1e135]: "KT(대표이사 김영섭)가 졸업·입학 및 밸런타인데이 시즌에 맞춰 전 연령층이 이용할 수 있는 2월 멤버십 프로모션 ‘달.달.혜택’을 선보인다고 14일 밝혔다. 2월 ‘달.달혜택’은 AI 분석을 기반으로 연령별 선호 혜택을 반영했다. MZ세대를 위해 ‘메가MGC커피’, ‘공차’, ‘스타벅스’ 등 카페 브랜드 할인과 ‘롯데 모바일 교환권’혜택을 제공하며, 사진 앱 ‘스노우(SNOW)'의 AI 미국 졸업사진 촬영 이용권을 선착순 3만 명에게 지원한다. 또한 중장년층 고객이 가장 선호하는 베이커리와 영화 할인 혜택을 매월 운영하고 있으며, AI 국가공인 자격증 ‘AICE 응시료' 할인 혜택 등도 KT단독으로 제공하고 있다. 2월 ‘달달초이스’는 ▲공차 50% 할인(인기메뉴 6종, 동일 음료 2잔 구매 시) ▲배달의민족·멕시카나 6천원 할인 ▲메가MGC커피 아메리카노 1천원 할인(2장) ▲ 던킨 40% 할인(최대 5천원) ▲뚜레쥬르 1천원당 300원 할인 ▲롯데시네마 6천원 영화예매권 중 원하는 혜택을 선택할 수 있다. ‘달달스페셜’은 ▲SNOW AI 졸업사진 1회 이용권 ▲반올림피자 8천원 할인(인기·신메뉴 4종) ▲그리팅 2만원 할인(5만원 이상 구매 시) ▲현대면세점 7천원 H.oney(온라인 선불카드) ▲롯데렌터카 G car 2시간 무료 이용권(대형·승합·GV70 및 제주 제외) ▲AICE 응시료·VOD 40% 할인 ▲원스토어 게임 20% 할인 혜택을 제공한다. ‘달달찬스’는 스타벅스 세트(음료4잔+케이크2개), 롯데 모바일 교환권, 메가박스 영화관람권 4매 추첨 이벤트를 진행한다. 만 34세 이하 고객을 위한 ‘Y혜택’도 운영한다. MZ세대의 취향을 반영한 ‘메가박스 데이지 스포츠세트’와 ‘MIXXO 20% 할인’, ‘쉐이크쉑 바닐라쉐이크 50% 할인’, ‘다이소 금액권’ 등을 선착순 제공하며, 매월 색다른 '캐릭터 굿즈' 이벤트를 진행한다. KT는 통신 3사 중 유일하게 Y고객을 위한 맞춤형 캐릭터 굿즈를 지속적으로 제공하고 있다. 또한, KT는 2월 문화 혜택으로 뮤지컬 ‘마타하리’와 ‘100층짜리 집’ 최대 60% 할인, 전시 ‘우연히 웨스 앤더슨 2’와 ‘미셸 앙리: 위대한 컬러리스트’, 전시 ‘디즈니 100년 특별전’, ‘우연히 웨스 앤더슨 2’, ‘미셸 앙리: 위대한 컬러리스트’ 50% 할인 혜택을 제공한다. 이 외에도 스타벅스와 메가MGC커피의 상시 혜택을 강화하고, 신규 제휴사를 지속적으로 추가할 계획이다. KT 서비스Product본부장 김영걸 상무는 “KT멤버십의 달.달.혜택과 Y혜택은 요일이나 등급 제한 없이 모든 고객이 2주간 사용할 수 있는 것이 강점”이라며, “AI 데이터 분석을 기반으로 다양한 연령층이 만족할 수 있도록 멤버십 혜택을 지속 강화하겠다”고 말했다. ※ 추가설명: ‘달.달.혜택’은 원하는 제휴사 혜택을 선택하는 ‘달달초이스’, 다양한 혜택을 중복 이용할 수 있는 ‘달달스페셜’, 추첨을 통해 경품을 제공하는 ‘달달찬스’로 구성된다. ※ 사진설명: KT가 졸업·입학 시즌을 맞아 2월 멤버십 프로모션 ‘달.달.혜택’을 선보인다고 14일 밝혔다. [KT사진1~6] 모델들이 사진 앱 스노우(SNOW) AI 미국 졸업사진 이용권 등 2월 KT 멤버십 달.달혜택을 소개하는 모습"
