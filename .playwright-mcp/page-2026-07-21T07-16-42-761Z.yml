            - generic [ref=f1e128]: "KT(대표이사 김영섭)는 가족 혜택 서비스 앱 KT 패밀리박스를 통해 가족 구성원이 각자의 혜택을 보다 편리하게 확인하고 함께 활용할 수 있도록 기능을 확대했다고 밝혔다. KT 패밀리박스는 현재 214만 가입자가 이용중인 통신 3사 유일 가족 혜택 플랫폼으로 가족 간 데이터 공유와 일정 관리, 제휴 혜택 제공 등 가족 단위 이용 환경을 고려한 기능을 제공해 왔다. 이번 업데이트에서는 가족 구성원의 멤버십 혜택 이용 현황을 공유할 수 있는 기능을 추가하고, 설맞이 제휴 할인과 고객 참여형 이벤트를 함께 운영한다. ■ 가족의 멤버십 주요 혜택부터 스마트폰 데이터·일정까지 가족 단위로 관리 KT 패밀리박스는 가족 구성원의 멤버십 등급과 주요 혜택 이용 현황을 한 화면에서 확인할 수 있는 기능을 제공한다. 앱 내 ‘가족 현황’ 메뉴를 통해 가족 구성원의 KT멤버십 등급을 확인할 수 있으며, VIP 고객의 경우 당월 사용 가능한 VVIP·VIP 초이스 혜택의 이용 여부도 함께 확인 가능하다. 해당 기능은 앱 업데이트 후 혜택 공유에 동의한 경우 이용 가능하며, 공유를 원하지 않는 경우 비공개 설정도 가능하다. 이와 함께 가족간 데이터 공유 기능과 패밀리 캘린더를 통한 일정 관리, 다양한 제휴 할인 쿠폰 제공 등 가족 구성원이 함께 이용할 수 있는 기능을 제공한다. ■ 설맞이 선물·식품·생활 서비스 제휴 할인과 참여형 이벤트 운영 KT 패밀리박스는 설을 맞아 명절 수요가 높은 선물·식품·생활 서비스 중심의 제휴 혜택을 운영한다. 풀무원 자사몰에서는 2만원 이상 구매 시 최대 8천원 할인, 첫 구매 고객 대상 3만원 이상 구매 시 1만원 할인 혜택을 제공하며, 오뚜기와 데이팩에서도 각각 최대 2만원, 3만원 한도의 30% 할인 혜택을 제공한다. 명절 이후 식단 관리에 활용할 수 있는 허닭 구매 금액대별 할인과 함께, 가사청소·이사·입주청소·반찬 구독 서비스를 이용할 수 있는 청소연구소 3종 쿠폰팩도 제공한다. 또한 제휴 쿠폰 사용 고객을 대상으로 경품 이벤트도 진행한다. 쿠폰을 1개 사용하면 메가커피 교환권을, 2개 이상 사용시 올리브영 5천원권을 100% 증정하며, 2개 이상 사용 고객에게는 삼성 AI 공기청정기 당첨 기회도 주어진다. 설 명절 기간에는 가족이 함께 참여할 수 있는 퀴즈 이벤트도 운영한다. 정답자 중 추첨을 통해 CU상품권을 증정하고 가족 구성원이 함께 참여한 경우 추가 혜택도 제공한다. ■ 매월 세 번째 금요일 ‘패박데이’ 통해 정기 참여형 혜택 제공 KT 패밀리박스는 고객의 정기적인 서비스 이용을 위해 매월 세 번째 금요일 ‘패박데이’를 운영한다. 패박데이는 앱 방문 후 응모만으로 참여 가능한 고객 감사 이벤트로, 월별로 다양한 경품을 제공한다. 2월 패박데이에는 응모 고객 중 3천명을 추첨해 바나나우유 교환권을 증정하고 추첨을 통해 1가족에게는 4인 가족 기준의 소피텔 호텔 호캉스 이용권도 제공한다. 패박데이는 올해 연중 상시 운영될 예정이다. KT 마케팅혁신본부장 권희근 상무는 “200만명 이상이 이용하는 패밀리박스 앱을 통해 가족에게 꼭 맞는 혜택을 지속적으로 발굴하고 제공해, 유용한 혜택을 놓치지 않고 활용할 수 있도록 서비스를 고도화해 나가겠다”고 말했다. ※ 사진설명: KT는 가족 혜택 서비스 KT 패밀리박스를 통해 가족 구성원이 각자의 혜택을 보다 편리하게 확인하고 함께 활용할 수 있도록 기능을 확대했다. [KT사진1~4] KT 가족 고객이 패밀리박스 앱을 소개하고 있다."
