            - img "서울 마포구에 위치한 롯데시네마 매장에서 고객들이 KT 멤버십 수험생 혜택인 라이브시네마 체험을 하며 모델들이 홍보하고 있는 모습 - 수험생을 위한 달콤한 혜택. KT멤버십 수험생 고객이라면 체험, 커피, 상품권까지 무료! LOTTE CINEMA. STARBUCKS. SALADI. SNOW. Goobne. MEGA CORREE. KT." [ref=f1e145]
