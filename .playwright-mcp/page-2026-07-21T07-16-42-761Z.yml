            - generic [ref=f1e107]: KT(대표이사 박윤영)가 5월을 맞아 외식·쇼핑·여가·문화 전반의 인기 브랜드 혜택을 담은 5월 달달혜택과 고객 보답 프로그램을 운영한다고 15일 밝혔다. 고객 보답 프로그램 5월 2차 혜택은 18일부터 31일까지 진행한다. KT멤버십 고객은 ▲투썸플레이스 전 메뉴 50% 할인(최대 5천원) 또는 ▲배달의민족X노랑통닭 8천원 할인(1만6천원 이상 주문 시) 중 하나를 선택해 이용할 수 있다. 고객 보답 프로그램은 KT멤버십 전 등급 고객이 이용할 수 있으며, 매월 2회 제공한다. 달달혜택은 5월 15일부터 31일까지 운영되며, 롯데마트 제타 최대 50% 할인, 할리스·폴바셋 커피 50% 할인, 파리바게뜨·쉐이크쉑·도미노피자 할인 등 일상에서 활용도 높은 외식·쇼핑 혜택을 제공한다. 이와 함께 플레이타임, 추억의 국민학교 떡볶이 등 가족 단위 고객을 위한 혜택도 마련했다. 또한 컬리·GS SHOP·크록스·롯데렌터카·신라면세점 할인, 마이리얼트립 여행 혜택, 아쿠아필드·원더파크 이용권 할인 등 쇼핑·여가를 아우르는 중복 혜택을 제공한다. 문화 혜택도 강화했다. KT멤버십 고객은 뮤지컬 ‘빌리 엘리어트’ 등 공연을 최대 55% 할인받을 수 있으며, ‘마리 로랑생 회고전’은 전 등급 50% 할인 혜택을 제공한다. 이 밖에도 영화 ‘와일드씽’과 ‘토이스토리5’ 시사회 초청과 다양한 응모 이벤트가 진행된다. KT Customer서비스본부장 강이환 상무는 “KT멤버십은 고객의 일상 소비는 물론 문화·여가 영역까지 아우르는 실효성 높은 혜택을 제공하고자 한다”며, “앞으로도 고객 체감 가치를 높이는 생활 밀착형 멤버십 서비스를 지속 확대해 나가겠다”고 말했다. [사진1~7] 고객들이 투썸플레이스 광화문점에서 5월 고객 보답 프로그램을 이용하는 모습
