            - generic [ref=f1e142]: "KT(대표이사 김영섭)가 송년모임과 크리스마스 등 연말에 사용하기 좋은 12월 멤버십 혜택을 마련했다고 9일 밝혔다. 먼저 크리스마스를 겨냥해 ‘KT 멤버십 크리스마스 컬렉션’을 준비했다. 파스쿠찌, 브레댄코, 뚜레쥬르 등 베이커리와 매드포갈릭, 더플레이스 등 외식 할인으로 구성돼 있으며, 모든 제휴 혜택을 중복으로 이용할 수 있다. 13일부터 시작하는 KT 멤버십 12월 ‘달.달.혜택’도 연말에 사용하기 좋은 여행과 외식 등 맞춤형 혜택으로 구성돼 있다. 달.달.혜택이란 ‘매달 선보이는 달콤한 혜택’이라는 뜻으로, 원하는 혜택을 골라 사용하는 ‘달달초이스’, 여러 제휴 혜택을 중복해 사용할 수 있는 ‘달달스페셜’, 추첨을 통해 경품을 제공하는 ‘달달찬스’가 있다. 12월 달달초이스는 팀홀튼 무료 도넛, 던킨 할인, 배달의민족 페리카나 할인, 도미노피자 온라인 방문포장 할인, 쉐이크쉑 무료 프라이와 소다, SSG.COM 할인, 샐러디 할인, 롯데시네마와 메가박스 영화예매권 등의 혜택을 제공한다. 달달스페셜은 추억의 국민학교 떡볶이, 땅스부대찌개, 크록스, 그리팅, 신라면세점, 트립닷컴, 어드벤처 부산, 설악워터피아, 원스토어 할인 등이다. 달달찬스는 알라딘 뮤지컬을 비롯해 메가박스 다이어리, 팀홀튼 아메리카노, 롯데시네마 가족관람권 등을 추첨으로 증정할 예정이다. 이 밖에도 만 34세 이하 청년 고객을 위한 ‘Y포차’ 프로모션을 10일까지 진행한다. 기말고사를 앞둔 대학생들을 위해 CU 에너지 드링크 할인, 아모레몰 뷰티포인트, 꿀스테이 할인 등을 준비했다. 또한 청년 취향에 맞는 서울일러스트레이션 페어 입장권, KUKKA(꾸까) 크리스마스 리스 만들기 클래스, 데이팩 멀티비타민 젤리, 아모레몰 X 위키드 콜라보 상품, 스와로브스키 데이트 패키지 등을 추첨을 통해 제공한다. 한편, KT 멤버십은 신규 제휴 혜택을 꾸준히 확대하고 있다. AI 활용능력 자격시험인 ‘AICE’ 응시료 및 온라인 교육 이용권, 이랜드몰, 빌리카, 어바웃펫 등의 할인 혜택이 12월에 추가됐다. KT 서비스Product본부장 김영걸 상무는 “KT 멤버십에서 크리스마스와 연말에 사용하기 좋은 다양한 혜택을 준비했다”며, “고객들의 멤버십 활용 형태에 대한 AI 분석을 통해 고객이 꼭 필요로 하는 혜택을 지속 발굴할 것”이라고 말했다. ※ 사진설명: KT가 송년모임과 크리스마스 등 연말에 사용하기 좋은 12월 멤버십 혜택을 마련했다고 9일 밝혔다. [사진1~9] 서울 중구에 위치한 매드포갈릭 매장에서 KT 고객들이 12월 크리스마스 컬렉션 멤버십 할인을 이용하고 있다."
