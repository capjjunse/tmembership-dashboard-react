            - img "모델들이 7월 KT멤버십 혜택을 소개하는 모습. - KT멤버십 2026 국가서비스대상 수상 기념. KT멤버십과 함께 호캉스 즐기세요!" [ref=f1e89]
            - generic [ref=f1e90]:
              - strong [ref=f1e91]: KT멤버십, 국가서비스대상 수상 기념 고객 참여형 이벤트 진행
              - generic [ref=f1e92]: 2026-06-30
            - generic [ref=f1e93]: "KT(대표이사 박윤영)가 2026 국가서비스대상 통신 멤버십·소상공인 매장관리 솔루션 부문 수상을 기념해 고객 참여형 이벤트를 진행한다고 30일 밝혔다. KT멤버십은 산업정책연구원(IPS)이 주관하고 산업통상자원부, 중소벤처기업부 등이 후원하는 ‘2026 국가서비스대상’ 통신 멤버십 부문 대상을 수상했다. 이와 함께 KT의 ‘사장이지’도 소상공인 매장관리 솔루션 부문 대상을 받아 KT는 서비스 경쟁력을 인정받았다. KT멤버십은 고객의 일상 전반에서 실질적인 혜택을 제공하는 대표 멤버십 서비스로 자리매김하며 차별화된 고객 가치를 창출해왔다. 다양한 제휴 혜택과 맞춤형 서비스, 멤버십 이용 활성화 프로그램을 통해 고객 만족도를 높이고 서비스 혁신을 추진해온 점에서 높은 평가를 받아 통신 멤버십 부문 대상 수상으로 이어졌다. 사장이지는 매출 분석, 근태 관리, 창업 정보 등 매장 운영에 필요한 기능과 KT의 다양한 매장 솔루션을 하나의 앱에서 통합 제공하는 소상공인 올인원 플랫폼이다. AI 기반 홍보 이미지 제작, 매장 맞춤형 음악 추천, 장사 코칭 등 차별화된 기능을 제공하며 출시 1년 만에 10만 가입자를 확보하는 등 소상공인 디지털 전환을 지원하고 있다. KT는 이번 수상을 기념해 고객 참여형 이벤트를 마련했다. 이번 이벤트는 고객이 선호하는 혜택과 브랜드를 선택하는 취향 밸런스 게임 형태로 구성됐으며, 고객 선택 결과를 향후 멤버십 혜택 기획에 반영해 고객 중심 서비스를 강화할 계획이다. 참여 고객 전원에게는 다이소 금액권, 외식 할인 쿠폰 등을 제공하며, 추첨을 통해 일부 고객에게는 프리미엄 숙박권을 증정한다. 이벤트는 KT멤버십 앱을 통해 7월 2일부터 14일까지 진행된다. KT는 7월에도 고객 보답 프로그램을 이어간다. 7월 1일부터 15일까지 진행되는 고객 보답 프로그램에서는 본격적인 여름 시즌을 맞아 아이스크림, 탄산수 등 인기 간식과 선풍기, 냉감 패드 등 여름철 필수 상품을 엄선하여 준비했다. 전 등급 고객이 ▲배스킨라빈스 50% 할인(최대 5천원) ▲쇼핑라운지 5천원 할인(배송비 무료) 중 하나를 선택해 이용할 수 있다. 달달혜택은 외식·카페 등 일상 활용도가 높은 인기 브랜드 중심으로 구성했다. 고객은 ▲폴바셋 ▲크리스탈 제이드 & 더 키친 일뽀르노 ▲빕스(VIPS) ▲도미노피자 ▲메가MGC커피 등 다양한 혜택을 선택해 이용할 수 있다. KT Customer서비스본부장 강이환 상무는 “KT멤버십은 고객 참여를 기반으로 지속적으로 혜택을 고도화하고 있다”며, “앞으로도 고객 선택과 의견을 실제 서비스에 반영해 고객 체감 가치를 지속 높여 나갈 계획”이라고 말했다. ※사진설명: KT가 2026 국가서비스대상 통신 멤버십 수상을 계기로 고객 참여형 이벤트를 마련했다. [KT사진1~6] 모델들이 7월 KT멤버십 혜택을 소개하는 모습"
        - listitem [ref=f1e94]:
          - link [ref=f1e95] [cursor=pointer]:
            - /url: https://corp.kt.com/html/promote/news/report_detail.html?rows=10&page=1&searchWord=%EB%A9%A4%EB%B2%84%EC%8B%AD&datNo=19173
            - img "[KT이미지1] 고객 보답 프로그램 - KT멤버십 고객보답 프로그램 KT를 이용해주시는 고객님께 감사의 마음으로 KT멤버십 특별 혜택을 드립니다! 우리 모두 다 같이, 응원을 힘찬 응원, 꽉찬 혜택! 2월부터 7월까지 매월 인기 브랜드의 특별한 할인 혜택. 매월 2회, 최대 2개 브랜드 혜택 중 하나를 선택하여 이용." [ref=f1e96]
            - generic [ref=f1e97]:
              - strong [ref=f1e98]: KT, 월드컵 시즌 맞아 6월 멤버십 프로그램 강화
              - generic [ref=f1e99]: 2026-06-15
            - generic [ref=f1e100]: "KT(대표이사 박윤영)가 외식·쇼핑부터 공연·전시까지 고객 일상 곳곳에서 누릴 수 있는 6월 고객 보답 프로그램과 달달·문화혜택을 선보인다고 15일 밝혔다. KT는 오는 16일부터 30일까지 고객 보답 프로그램 2차 라인업을 운영한다. 이번 프로그램은 월드컵 시즌을 맞아 고객들이 응원과 모임 등 일상 속 다양한 순간에서 활용할 수 있도록, 외식·간편식 등 실사용성이 높은 브랜드 중심으로 구성했다. 고객은 GS25 컵라면·디저트 50% 할인(최대 1천900원) 또는 던킨 전 품목 50% 할인(최대 6천원) 중 선택해 이용할 수 있다. GS25 혜택은 컵라면 2개 또는 모찌 디저트 1개 중 선택 가능하다. 달달혜택은 외식·커피·영화 등 선호도 높은 브랜드로 구성했다. KT멤버십 고객은 ▲VIPS 채끝스테이크 무료 ▲배달의민족 X 노모어피자 최대 1만원 할인 ▲더벤티 아이스 아메리카노 1천원 할인(2매) ▲공차 50% 할인 ▲버거킹 최대 50% 할인 ▲롯데시네마 7천원 영화예매권 중 선택해 이용할 수 있다. 쇼핑·여행·생활 영역에서도 아모레몰, 그리팅, GS칼텍스, KKday, 원스토어 할인 혜택과 메가박스 경품 이벤트 등 다양한 혜택을 마련했다. 특히 KT는 월드컵 시즌을 맞아 KT멤버십 쇼핑라운지에서 ‘대한민국 응원 특가전’을 운영하며 시즌 맞춤형 혜택을 강화했다. 나이키 국가대표 유니폼, 이강인 사인볼, 쿨러백, 빔프로젝터 등 월드컵 관련 인기 상품을 보다 합리적인 가격에 구매할 수 있도록 구성했다. 쇼핑라운지는 KT멤버십 앱에서 이용 가능하며, 이번 기획전은 7월 1일까지 진행된다. KT멤버십은 문화 혜택 프로그램 ‘컬처앤모어’ 등 경험형 혜택도 지속적으로 확대하고 있다. 6월 한 달간 ▲뮤지컬 ‘그날들’ 최대 50% 할인 ▲뮤지컬 ‘서편제’ 최대 45% 할인 ▲뮤지컬 ‘오지게 재밌는 가시나들’ 35% 할인 ▲전시 ‘베르디’ 50% 할인 등 공연·전시 관람 혜택을 제공한다. KT Customer서비스본부장 강이환 상무는 “KT멤버십은 월드컵 시즌을 맞아 고객들이 더욱 즐겁게 응원하고 일상을 즐길 수 있도록 다양한 혜택을 준비했다”며, “앞으로도 고객 라이프스타일에 맞춘 멤버십 경험을 지속 확대해 나가겠다”고 말했다. ※사진설명: KT가 외식·쇼핑부터 공연·전시까지 고객 일상 곳곳에서 누릴 수 있는 6월 고객 보답 프로그램과 달달·문화혜택을 선보인다 [KT사진1~7] 모델들이 KT멤버십 6월 혜택을 소개하는 모습 [KT이미지1] 고객 보답 프로그램 [KT이미지2] KT멤버십 쇼핑라운지 대한민국 응원 특가전"
