              - generic [ref=f1e148]: 2024-11-08
            - generic [ref=f1e149]: "KT(대표이사 김영섭)가 2025학년도 대학수학능력시험을 앞둔 수험생들을 위해 테마파크, 쇼핑, 롤플레잉 체험 등 맞춤형 11월 멤버십 혜택을 준비했다고 11일 밝혔다. KT는 15일부터 시작하는 KT 멤버십 11월 ‘달.달.혜택’에서 ‘나를 위한 선물’이라는 테마로 제휴 혜택을 준비했다. 달.달.혜택이란 ‘매달 선보이는 달콤한 혜택’이라는 뜻으로, 원하는 혜택을 골라 사용하는 ‘달달초이스’, 여러 제휴 혜택을 중복해 사용할 수 있는 ‘달달스페셜’, 추첨을 통해 경품을 제공하는 ‘달달찬스’가 있다. 특히 11월 달달혜택은 수험생을 위한 맞춤 혜택으로 전문 배우와 함께 하는 롤플레잉 체험인 롯데시네마 ‘라이브시네마’ 이용권, ‘고생한 나를 위한 선물’ 구입을 위한 롯데백화점 상품권, 스타벅스 음료, 도미노 프리미엄 피자 온라인 주문 할인, 사진 앱 ‘SNOW’의 AI 미국 졸업사진 이용권, 롯데월드 어드벤처 이용권, 이니스프리 할인 등이 마련돼 있다. 수험생 맞춤 혜택은 2004년생부터 2006년생까지 KT 멤버십 고객에게 제공되며, 모든 혜택을 중복으로 이용할 수 있다. 달달초이스로는 굽네치킨, 샐러디, 피자헛, 배달의민족X두찜, 파리바게뜨, 메가MGC커피, 롯데시네마 등에서 할인 혜택을 제공한다. 달달스페셜은 롯데면세점, 아고다, SK렌터카, 원스토어, 스와로브스키 카페, 김캐디, 크록스 할인 등 ‘나를 위한 선물’로 적합한 쇼핑과 외식 중심의 혜택이 준비돼 있다. KT의 캐치콜 및 V컬러링 고객 대상으로는 스타벅스 자바칩 프라푸치노, 아메리카노, 제조음료 1+1 쿠폰을 무작위로 제공한다. 달달찬스는 스타벅스 텀블러, 메가벅스 스타벅스 데비머그컵, 네이버페이 금액권 등을 추첨으로 증정할 예정이다. 아울러 12일까지는 만 34세 이하 고객을 위한 Y포차 프로모션을 진행한다. CU 탄산음료 50% 할인, 스타벅스 무료 음료, SNOW AI 증명사진 1회 무료 등의 혜택을 선착순으로 제공하며, 청년 고객 취향에 맞는 서울일러스트코리아 윈터 입장권, 호도 세라믹 클래스, 데이팩 멀티비타민 젤리, 메가박스 토이스토리 발매트 등을 추첨을 통해 증정한다. KT 고객경험혁신본부장 이병무 상무는 “수능 시즌에 맞춰 수험생들이 즐길 수 있는 다양한 혜택을 준비했다”며, “KT 멤버십 이용 AI 분석을 통해 고객 선호도가 높은 제휴 혜택을 지속 발굴하겠다”고 말했다. ※ 사진설명: KT가 수험생들을 위해 테마파크, 쇼핑, 롤플레잉 체험 등으로 구성된 멤버십 혜택을 준비했다고 11일 밝혔다. [사진 1~5] 서울 마포구에 위치한 롯데시네마 매장에서 고객들이 KT 멤버십 수험생 혜택인 라이브시네마 체험을 하고 있다."
