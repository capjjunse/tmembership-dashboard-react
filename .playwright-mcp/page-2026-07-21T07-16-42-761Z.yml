            - generic [ref=f1e121]: "KT(대표이사 김영섭)가 전 고객을 대상으로 인기 브랜드 할인을 제공하는 ‘3월 고객 보답 프로그램’과 식음료·쇼핑 분야에서 최대 50% 할인을 지원하는 ‘달달혜택’을 시행한다고 16일 밝혔다. KT는 오는 17일부터 모든 멤버십 고객에게 ‘롯데리아 핫크리스피버거 세트 4천원 딜(51%할인)’ 또는 ‘빽다방 아메리카노(HOT) 2잔 무료’ 혜택 중 하나를 선택 제공한다. 빽다방 쿠폰은 메뉴 변경이 가능하여 음료 및 디저트 구매 시 3천400원 할인 효과를 얻을 수 있다. KT멤버십은 7월까지 매월 최대 2개 브랜드 혜택을 이용할 수 있도록 고객 보답 프로그램을 지속 운영할 계획이다. 차수별 제휴 브랜드는 변경되며, 브랜드와 혜택 및 이용방법은 KT멤버십 앱/웹을 통해 순차적으로 오픈한다. 고객은 KT멤버십·마이케이티 앱 또는 KT닷컴에서 쿠폰을 다운로드한 뒤, 제휴사에서 쿠폰 바코드나 쿠폰 번호를 제시하여 혜택을 받을 수 있다. 3월 달달혜택은 오는 31일까지 진행한다. 먼저 고객이 하나의 혜택을 선택해 이용할 수 있는 ‘달달초이스’는 ▲홍콩반점 짜장면 3천900원 딜 & 역전우동 꼬치어묵우동 3천500원 딜(최대 62% 할인) ▲도미노피자 온라인 방문포장 50% 할인(2만5천원 이상 4만5천원까지) ▲배달의민족X꾸브라꼬숯불치킨 6천500원 할인(2만4천원 이상 주문 시) ▲쉐이크쉑 프라이+소다(S) 무료(1만원 이상 구매 시) ▲더벤티 아이스 아메리카노 1천원 할인(2매) ▲팀홀튼 오리지널 아이스캡 (M) 무료 ▲폴바셋 룽고(S) 또는 라떼(S) 50% 할인 ▲파리바게뜨 4천원 할인(1만원 이상 구매 시) ▲이니스프리 5천원 할인(1만5천원 이상 구매 시) + 비타민C 겔마스크 2매 증정(3만원 이상 구매 시) ▲CJ더마켓 1만2천원 할인(5만원 이상 구매 시) 등을 제공한다. '달달스페셜'은 중복 이용이 가능하며, 여행·쇼핑·생활 분야에서 다양한 제휴 혜택을 제공한다. 주요 혜택으로는 ▲모던하우스 장바구니 20% 할인 쿠폰(2매) + 상품 30% 할인 쿠폰(1매) ▲포케올데이 30% 할인 (최대 6천원, 앱 주문 시) ▲디저트39 후레쉬베리케익 1만원 할인 ▲추억의 국민학교 떡볶이 45% 할인 ▲크록스 3만원 할인(9만원 이상 구매 시) ▲그리팅 2만원 할인(5만5천원 이상 구매 시) ▲현대면세점 1만원 허니(H.oney) 적립금 제공(온라인 선불카드, $50이상 구매 시) ▲롯데렌터카 차방정 플러스 멤버십 2개월 이용권 1천원 구매 쿠폰(매월 주유권 5천원 제공) ▲구버 PRO 플랜 1개월 이용권 ▲원스토어 게임 카테고리 30% 할인 쿠폰(최대 1만원) 등이다. KT는 매월 진행하는 문화혜택 ‘컬처앤모어’를 더욱 풍성하게 준비했다. KT멤버십 고객이라면 등급에 상관없이 뮤지컬 ‘데스노트’, ‘은밀하게 위대하게’, 연극 ‘불란서 금고-북벽에 오를 자 누구더냐’, 전시 ‘룸 포 원더’ 등을 최대 50% 할인 받을 수 있다. 또한 전시 ‘룸 포 원더: 상상의 문을 열다’의 프라이빗 도슨트 투어 응모 이벤트를 31일까지 시행하며, 투어는 4월 15일에 진행될 예정이다. 응모 고객 전원에게는 해당 전시의 40% 할인 쿠폰을 추가로 제공한다. KT 서비스Product본부장 김영걸 상무는 “고객 보답 프로그램은 고객에게 감사한 마음을 담은 것인만큼 고객들이 사용하기 쉽도록 메뉴 선택 폭을 넓혔고 브랜드를 다양하게 제공하고자 한다”며, “앞으로도 고객에게 실질적인 가치를 제공하는 프로그램을 선보이겠다”고 말했다. [KT사진1~8] 모델들이 3월 KT멤버십 혜택을 소개하는 모습"
