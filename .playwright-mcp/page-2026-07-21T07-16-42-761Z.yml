            - generic [ref=f1e114]: "KT(대표이사 박윤영)가 고객의 일상 소비 패턴에 맞춰 식음료부터 생필품까지 다양한 혜택으로 구성한 ‘4월 고객 보답 프로그램’과 ‘달달혜택’을 마련했다고 15일 밝혔다. KT는 오는 16일부터 고객 보답 프로그램의 일환으로 배스킨라빈스 50% 할인 또는 쇼핑라운지 6천원 할인 중 하나를 제공한다. 배스킨라빈스는 최대 5천원 할인으로, 파인트 사이즈를 4천900원에 이용할 수 있다. 쇼핑라운지는 생활 밀착형 상품을 멤버십 혜택가로 제공하는 전용 커머스다. 생수, 휴지 등의 상품을 최대 90% 할인가에 구매할 수 있다. 전 상품 배송비는 무료이며 KT멤버십 앱에서 이용 가능하다. 달달혜택은 15일부터 30일까지 운영한다. 고객이 하나의 혜택을 선택해 이용하는 ‘달달초이스’에는 ▲뚜레쥬르 ▲메가MGC커피 ▲이디야커피 ▲파파존스피자 ▲배달의민족 X 요거트월드 ▲다운타우너 ▲롯데시네마 등 고객 선호도가 높은 식음료·외식·문화 브랜드 혜택을 포함했다. 이 가운데 뚜레쥬르 혜택은 가정의 달 수요를 고려해 다음 달 15일까지 이용 기간을 연장했다. 중복 이용이 가능한 ‘달달스페셜’은 쇼핑·여행·라이프스타일 영역 전반으로 혜택 범위를 확대했다. 롯데마트 제타, 롯데월드 어드벤처, 아모레몰, 풀무원, KT알파 쇼핑, 크록스, 롯데면세점, 아고다, 롯데렌터카, 스피드메이트 등 다양한 제휴 브랜드 혜택을 제공한다. KT는 멤버십 고객을 대상으로 15일 저녁 프라이빗 도슨트 투어를 진행한다. 초청 고객은 그라운드시소 이스트에서 열리는 전시 ‘룸 포 원더: 상상의 문을 열다’를 무료로 관람할 수 있으며, 전문 도슨트 해설과 전시 굿즈도 제공받는다. KT는 앞으로도 공연·전시 등 문화 콘텐츠와 멤버십을 연계해 경험 중심의 차별화된 혜택을 확대해 나갈 계획이다. KT Customer서비스본부장 강이환 상무는 “KT멤버십은 고객이 실제로 자주 찾는 브랜드와 생활 필수 영역을 중심으로 혜택을 설계하고 있다”며, “특히 4월 고객 보답 프로그램은 식음료와 생필품 등 활용도가 높은 혜택을 중심으로 구성해 고객이 체감할 수 있는 가치를 한층 강화했다”고 말했다. [KT사진1~3] 모델들이 KT멤버십 4월 혜택을 소개하는 모습"
