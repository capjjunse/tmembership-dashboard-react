            - img "모델들이 사진 앱 스노우(SNOW) AI 미국 졸업사진 이용권 등 2월 KT 멤버십 달.달혜택을 소개하는 모습 - 새로운 시작을 응원해요. KT멤버십 2월 달달혜택 연령별 맞춤 혜택 강화. SNOW, TOUS les JOURS, AICE, Gongcha,KT." [ref=f1e131]
            - generic [ref=f1e132]:
