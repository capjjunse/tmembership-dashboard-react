            - img "서울의 한 롯데리아 매장에서 모델들이 10월 KT 멤버십 ‘롯데 컬렉션’ 혜택을 소개하고 있다. - 푸드, 테마파크, 렌터카까지. KT멤버십 달달혜택. 롯데 컬렉션 등 혜택 강화. 롯데리아, 크리스피크림 도넛, 롯데시네마, 도미노피자, 롯데시네마, 서울스카이, 뚜레쥬르, 던킨" [ref=f1e152]
