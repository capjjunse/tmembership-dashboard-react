              - generic [ref=f1e155]: 2024-10-15
            - generic [ref=f1e156]: "KT(대표이사 김영섭)가 가을 나들이 철을 맞아 푸드, 테마파크, 쇼핑, 영화 등을 중심으로 10월 멤버십 혜택을 강화한다고 15일 밝혔다. 15일부터 시작하는 KT 멤버십 10월 ‘달.달.혜택’에선 가족과 나들이 시즌을 보낼 수 있는 맞춤형 혜택을 준비했다. 달.달.혜택이란 ‘매달 선보이는 달콤한 혜택’이라는 뜻으로, 원하는 혜택을 골라 사용하는 ‘달달초이스’, 여러 제휴 혜택을 중복해 사용할 수 있는 ‘달달스페셜’, 추첨을 통해 경품을 제공하는 ‘달달찬스’가 있다. 특히 KT는 달달혜택에서 롯데그룹과 손잡고 롯데리아, 크리스피크림 도넛, 롯데시네마, 롯데렌터카, 롯데월드 어드벤처, 롯데월드 아쿠아리움, 서울스카이 등 원하는 롯데 브랜드 혜택을 모두 중복해 이용할 수 있는 ‘롯데 컬렉션’을 선보인다. 롯데 컬렉션은 다른 달달혜택과 중복해 사용할 수 있다. KT 멤버십 롯데 컬렉션을 통해 고객들은 롯데리아에서 ‘리아 새우 콤보’ 또는 ‘핫크리스피 치킨 버거 콤보’ 45% 할인, 크리스피크림도넛에서 ‘오리지널 글레이즈드 더즌’ 40% 할인을 받을 수 있다. 또한 롯데월드 어드벤처에선 본인 및 동반 1인 45% 할인을 받을 수 있으며 롯데렌터카의 카셰어링 브랜드 ‘G car’에서 2시간 무료 이용권까지 모두 받을 수 있다. 10월 달달초이스는 CU 모바일상품권, 배민X호식이두마리치킨, 도미노피자, 던킨, 뚜레쥬르, 쉐이크쉑, 이니스프리, SNOW 등에서 무료 및 할인 혜택을 제공한다. 특히 나들이 메뉴로 적합한 도미노피자 포장 주문 50% 할인 및 던킨 50% 할인과 취업 시즌에 사용할 ‘SNOW’의 AI 증명사진 1개월 무료 이용권 등이 10월 맞춤형 특화 혜택으로 구성됐다. 달달스페셜은 그리팅, 아모레몰, 삼다수, 프레시코드, 뽀로로파크, 이월드, 원스토어, KT알파 쇼핑 등 쇼핑 및 테마파크 중심의 혜택이 준비돼 있으며, 달달찬스는 롯데시네마 가족관람권, 스타벅스 텀블러, 메가박스 감정 무드등 등에 대한 추첨 이벤트를 진행할 예정이다. KT 고객경험혁신본부장 이병무 상무는 “KT가 가을 나들이 시즌에 사용하기 좋은 다양한 멤버십 혜택과 함께 롯데그룹 제휴사 브랜드들의 혜택을 함께 중복해 받을 수 있는 롯데 컬렉션을 준비했다”며, “고객들이 KT 멤버십의 가치를 더욱 크게 체감할 수 있도록 시즌에 맞는 특화형 혜택을 지속 제공하겠다”고 말했다. ※ 사진설명: KT가 가을 나들이 철을 맞아 푸드, 테마파크, 쇼핑, 영화 등을 중심으로 10월 멤버십 혜택을 강화한다고 15일 밝혔다. [사진1~6] 서울의 한 롯데리아 매장에서 모델들이 10월 KT 멤버십 ‘롯데 컬렉션’ 혜택을 소개하고 있다."
